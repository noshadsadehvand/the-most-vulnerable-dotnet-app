# SonarQube Cloud scan (build-based, needed for C# security analysis).
# Needs: repository secret SONAR_TOKEN.
name: SonarQube Cloud
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin /k:"noshadsadehvand_the-most-vulnerable-dotnet-app" /o:"noshadsadehvand" \
            /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io"
          dotnet build DotnetSecurityFailures.slnx --configuration Release
          dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
